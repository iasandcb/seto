[package]
name = "seto-core"
version = "0.1.0"
description = "Shared Seto (Sebeolsik 390) input core: Hangul composition, layouts, and lexicon."
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"

[dev-dependencies]
serde_json = "1"
